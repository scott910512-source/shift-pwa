<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>4조 2교대 근무표</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="공장 4조 2교대 근무표. 오늘 주간·야간 근무조와 근무자 명단을 바로 확인합니다.">

<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1216" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="근무표">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<header class="hd">
  <div class="hd-r1">
    <h1 class="hd-title">4조 2교대 근무표</h1>
    <button class="icobtn" id="hdSettings" type="button" aria-label="설정">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.1a1.7 1.7 0 0 0 1.56 1.02H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.03z"/>
      </svg>
    </button>
  </div>
  <div class="hd-r2">
    <span class="hd-date" id="hdDate">—</span>
    <span class="hd-time" id="hdTime">--:--</span>
  </div>
</header>

<main class="main">

  <!-- ================= 홈 ================= -->
  <section class="view" id="viewHome">
    <div id="homeCards"></div>
    <div class="offbar" id="homeOff"></div>
    <div id="homeCal" class="calbox"></div>
  </section>

  <!-- ================= 달력 ================= -->
  <section class="view" id="viewCal" hidden>
    <div id="fullCal" class="calbox"></div>
    <div class="legend">
      <span><i class="sw d"></i>주간</span>
      <span><i class="sw n"></i>야간</span>
      <span class="legend-hint">날짜를 누르면 근무자 명단이 나옵니다</span>
    </div>
  </section>

  <!-- ================= 조 정보 ================= -->
  <section class="view" id="viewCrew" hidden>
    <div class="seg" id="crewSeg" role="tablist" aria-label="조 선택"></div>
    <div id="crewBody"></div>
  </section>

  <!-- ================= 설정 ================= -->
  <section class="view" id="viewSet" hidden>
    <div class="seg seg-wrap" id="setSeg" role="tablist" aria-label="설정 분류"></div>
    <div id="setBody"></div>
  </section>

</main>

<nav class="tabbar" id="tabbar" role="tablist" aria-label="주요 화면"></nav>

<div class="backdrop" id="backdrop" hidden></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <header class="sheet-hd">
    <button class="icobtn" id="sheetPrev" type="button" aria-label="이전 날">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 class="sheet-title" id="sheetTitle">—</h2>
    <button class="icobtn" id="sheetNext" type="button" aria-label="다음 날">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </header>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot">
    <button class="btn btn-wide" id="sheetClose" type="button">닫기</button>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="./app.js"></script>
</body>
</html>
